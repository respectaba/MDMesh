name: server

on:
  push:
    paths:
      - "pom.xml"
      - "common/**"
      - "jwt/**"
      - "notification/**"
      - "plugins/**"
      - "server/**"
      - "swagger/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "pom.xml"
      - "common/**"
      - "jwt/**"
      - "notification/**"
      - "plugins/**"
      - "server/**"
      - "swagger/**"
      - ".github/workflows/server.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: dmtest
          POSTGRES_DB: mdmesh_configuration_contract
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U dmtest -d mdmesh_configuration_contract"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROVIDER_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/mdmesh_configuration_contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Provide build.properties
        run: cp server/build.properties.example server/build.properties
      - name: Contract, unit and PostgreSQL14 snapshot tests
        # Synthetic DB only; tests refuse provider/production database names.
        # Included CI allowance only; preserve the account paid-spending hard stop.
        run: mvn -B -pl common test
      - name: Build WAR
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-war
          path: server/target/launcher.war
          if-no-files-found: error
